<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Dark rounded-square icon background matching Partly aesthetic -->
  <rect width="512" height="512" rx="108" fill="#0a0a0d"/>

  <!-- 1. AMBER UPPER-RIGHT COMPONENT -->
