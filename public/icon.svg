    <!-- Blade 4: Bottom Left -->
    <path d="M 0 0 L -28 32 C -36 26 -40 14 -38 6 L -13 0 Z"/>
    <!-- Blade 5: Top Left -->
    <path d="M 0 0 L -40 -16 C -42 -26 -34 -36 -26 -40 L -6 -12 Z"/>
  </g>
  <!-- Fan Amber Central Hub -->
  <circle cx="196" cy="230" r="13" fill="#ff9900"/>

  <!-- 3. WHITE MID-RIGHT CONNECTOR COMPONENT -->
  <path d="M 288 274 C 294 268 304 266 312 270 L 414 316 C 424 321 428 333 423 343 L 392 405 C 387 415 375 419 365 414 L 263 368 C 253 363 249 351 254 341 L 280 288 C 282 283 285 278 288 274 Z" fill="#f1f3f7"/>
