<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#090B10" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Partly" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>Partly</title>
    <style>
      html, body, #root {
        background-color: #090B10;
        color: #f1f2f6;
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
      }
    </style>
    <script>
      // Early global error suppression for iframe cross-origin warnings
      window.addEventListener(
        'error',
        function (event) {
          const msg = event.message || (event.error && event.error.message) || '';
          if (
            msg.includes('SecurityError') ||
            msg.includes('cross-origin frame')
          ) {
            event.stopImmediatePropagation();
            event.preventDefault();
            return false;
          }
        },
        true
      );
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    </noscript>
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" href="/partly-icon-512.png" />
    <link rel="apple-touch-icon" href="/partly-icon-512.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
